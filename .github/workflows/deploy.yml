name: deploy

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Keyed per ref rather than sharing the deploy's group, so a pull request
    # under review cannot queue behind or in front of a deploy. Superseded
    # pull request runs are disposable; every trunk commit earns its own.
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Both tiers. The browser tier builds its own Playwright image, so this
      # step is the slow one.
      - run: ./scripts/test.sh

  deploy:
    needs: test
    runs-on: ubuntu-latest

    # Trunk only. A pull request's ref is refs/pull/N/merge, so this excludes
    # them, and it also stops a manual dispatch from some branch publishing.
    if: github.ref == 'refs/heads/trunk'

    # Never let two deploys race; queue rather than cancel, so a push landing
    # during a deploy still reaches production.
    concurrency:
      group: pages
      cancel-in-progress: false

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      # Explicit sha rather than the default HEAD: a CI checkout is detached
      # and shallow, so this is the one value guaranteed to be the deployed one.
      - run: ./scripts/build.sh "${GITHUB_SHA}"

      - uses: actions/configure-pages@v6

      # Only the build output. tests/ and scripts/ were being published too
      # when this uploaded the whole repository.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
