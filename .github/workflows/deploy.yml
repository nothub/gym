name: deploy

on:
  push:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys race; queue rather than cancel, so a push that lands
# during a deploy still reaches production.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Both tiers. The browser tier builds its own Playwright image, so this
      # step is the slow one.
      - run: ./scripts/test.sh

  deploy:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      # Explicit sha rather than the default HEAD: a CI checkout is detached
      # and shallow, so this is the one value guaranteed to be the deployed one.
      - run: ./scripts/build.sh "${GITHUB_SHA}"

      - uses: actions/configure-pages@v5

      # Only the build output. tests/ and scripts/ were being published too
      # when this uploaded the whole repository.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
