<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Timer</title>
<meta name="theme-color" content="#0f0f0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<!-- reset first, then ours: the reset zeroes margins and line-height that
     the rules below then set deliberately. -->
<link rel="stylesheet" href="reset.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <form id="setup">
    <h1>Gym Timer</h1>

    <fieldset id="strategies">
      <legend class="sr-only">Strategy</legend>
      <label><input type="radio" name="strategy" value="intervals" checked> ⏱️ Intervals</label>
      <label><input type="radio" name="strategy" value="amrap"> ⚡ AMRAP</label>
      <label><input type="radio" name="strategy" value="rft"> 🏁 RFT</label>
    </fieldset>

    <!-- One row per strategy, swapped by strategy rather than removed: a
         click fills the fields below with that preset's numbers and stays on
         whichever strategy is already active -- EMOM does not open a
         different screen, it fills in Intervals'. -->
    <div class="preset-row" id="intervals-presets" role="group" aria-label="Intervals presets">
      <button type="button" data-intervals-preset="emom">
        EMOM<span class="preset-detail" id="detail-emom"></span>
      </button>
      <button type="button" data-intervals-preset="e2mom">
        E2MOM<span class="preset-detail" id="detail-e2mom"></span>
      </button>
      <button type="button" data-intervals-preset="tabata">
        Tabata<span class="preset-detail" id="detail-tabata"></span>
      </button>
    </div>
    <div class="preset-row" id="amrap-presets" role="group" aria-label="AMRAP presets" hidden>
      <button type="button" data-amrap-preset="10">10 min</button>
      <button type="button" data-amrap-preset="15">15 min</button>
      <button type="button" data-amrap-preset="20">20 min</button>
    </div>
    <div class="preset-row" id="rft-presets" role="group" aria-label="RFT presets" hidden>
      <button type="button" data-rft-preset="3">3 rounds</button>
      <button type="button" data-rft-preset="5">5 rounds</button>
      <button type="button" data-rft-preset="10">10 rounds</button>
    </div>

    <div id="interval-fields">
      <div>
        <label for="work-secs">🏋️ Work</label>
        <!-- text, not number: "1:30" is not a number. inputmode keeps the
             numeric keypad, and bare digits read as seconds, so every duration
             stays reachable on a keypad with no colon on it. -->
        <input id="work-secs" type="text" inputmode="numeric" value="1:00">
      </div>
      <div>
        <label for="rest-secs">😴 Rest</label>
        <input id="rest-secs" type="text" inputmode="numeric" value="0:00">
      </div>
    </div>

    <div>
      <label for="count" id="count-label">Cycles</label>
      <!-- A count for Intervals and RFT, a duration for AMRAP, which is why it
           is text: the active strategy decides how it parses. -->
      <input id="count" name="count" type="text" inputmode="numeric" value="10" required>
    </div>

    <fieldset id="cues">
      <legend class="sr-only">Cues</legend>
      <label><input id="cue-sound" type="checkbox" checked> 🔔 Sound</label>
      <!-- 📳 rather than one of the salvaged set: none of those mean
           vibration, and an unmatched pair next to a labelled one reads as
           an oversight rather than a choice. -->
      <label><input id="cue-buzz" type="checkbox" checked> 📳 Buzz</label>
    </fieldset>

    <button type="submit">Start</button>
  </form>

  <section id="timer" hidden>
    <p id="round-label">&nbsp;</p>
    <button type="button" id="seconds" role="timer" disabled>10</button>
    <!-- RFT's finish only. It takes the digits' place rather than sitting
         under them: the per-round times are the result there, and the total
         has already moved up to the label above. -->
    <ol id="laps" hidden></ol>
    <p id="phase">Get ready</p>
    <p id="tap-hint" class="reserved">tap to count</p>
    <div id="controls">
      <button type="button" id="pause">Pause</button>
      <button type="button" id="reset">Reset</button>
    </div>
  </section>
</main>

<footer>
  <!-- _blank so a standalone install hands these to the browser rather than
       navigating the timer away mid-workout.
       The build link is filled in from version.js at runtime. What is written
       here is the fallback: "dev" pointing at the commit list is the honest
       answer for a copy that was never built. -->
  <a href="https://github.com/nothub/gym-timer" target="_blank" rel="noopener noreferrer">github.com/nothub/gym-timer</a>
  <span aria-hidden="true">·</span>
  <a id="build" href="https://github.com/nothub/gym-timer/commits/trunk" target="_blank" rel="noopener noreferrer">dev</a>
  <!-- Revealed only once the browser has offered an install to open. Starts
       hidden because on most engines that offer never comes: see the
       beforeinstallprompt handler. -->
  <span id="install-sep" aria-hidden="true" hidden>·</span>
  <button id="install" type="button" hidden>install</button>
</footer>

<p id="live" class="sr-only" aria-live="polite"></p>

<noscript>
  <p>This timer needs JavaScript. There is no way to count seconds without it.</p>
</noscript>

<!-- Sets self.BUILD. The service worker imports this same file, so the footer
     and the worker's cache name cannot disagree about which build is running. -->
<script src="version.js"></script>

<script>
"use strict";

const PREP_MS = 10000;

const el = {
  setup: document.getElementById("setup"),
  strategies: document.getElementById("strategies"),
  intervalsPresets: document.getElementById("intervals-presets"),
  amrapPresets: document.getElementById("amrap-presets"),
  rftPresets: document.getElementById("rft-presets"),
  count: document.getElementById("count"),
  countLabel: document.getElementById("count-label"),
  intervalFields: document.getElementById("interval-fields"),
  workSecs: document.getElementById("work-secs"),
  restSecs: document.getElementById("rest-secs"),
  timer: document.getElementById("timer"),
  phase: document.getElementById("phase"),
  seconds: document.getElementById("seconds"),
  roundLabel: document.getElementById("round-label"),
  pause: document.getElementById("pause"),
  reset: document.getElementById("reset"),
  live: document.getElementById("live"),
  cues: document.getElementById("cues"),
  cueSound: document.getElementById("cue-sound"),
  cueBuzz: document.getElementById("cue-buzz"),
  build: document.getElementById("build"),
  tapHint: document.getElementById("tap-hint"),
  laps: document.getElementById("laps"),
  install: document.getElementById("install"),
  installSep: document.getElementById("install-sep"),
};

/* ---------- strategies ---------- */
// Three strategies, one radio each. A preset is not a fourth kind of state:
// it is a button that fills in the fields belonging to whichever strategy is
// already active, and nothing remembers that it was clicked -- editing a
// field afterward leaves no preset "current" to reflect. Work/rest are always
// on screen for Intervals; there is no separate "Custom" to hide them behind.
const STRATEGIES = ["intervals", "amrap", "rft"];

// Durations are seconds everywhere inside the app and MM:SS everywhere on it.
// Bare digits parse as seconds, so a numeric keypad -- which has no colon --
// still reaches every value: 90 and 1:30 are one duration typed two ways.
function parseDuration(text) {
  const t = String(text).trim();
  const mmss = t.match(/^(\d+):([0-5]\d)$/);
  if (mmss) return Number(mmss[1]) * 60 + Number(mmss[2]);
  // Seconds alone, unbounded, so "90" and "720" both work. Rejecting "1:75"
  // is the reason the branch above pins the seconds field to two digits.
  return /^\d+$/.test(t) ? Number(t) : NaN;
}

function formatDuration(totalSecs) {
  const mins = Math.floor(totalSecs / 60);
  const secs = totalSecs % 60;
  return `${mins}:${String(secs).padStart(2, "0")}`;
}

const INTERVALS_PRESETS = {
  emom: { work: 60, rest: 0, cycles: 10 },
  e2mom: { work: 120, rest: 0, cycles: 6 },
  // The timing convention, not the protocol. Tabata 1996 prescribes 7 to 8
  // sets on a cycle ergometer at ~170% VO2max, and credits the structure to
  // speed-skating coach Kouichi Irisawa. "20/10 x8" borrows the clock and
  // nothing else, which is all a timer can offer -- the label must not be read
  // as claiming the rest. Med Sci Sports Exerc. 1996;28(10):1327-30, PMID 8897392.
  tabata: { work: 20, rest: 10, cycles: 8 },
};
// Minutes and rounds respectively -- durations and round counts with no
// exercise content behind them, since the app never knows what one contains.
const AMRAP_PRESETS = [10, 15, 20];
const RFT_PRESETS = [3, 5, 10];

const DEFAULT_COUNT = { intervals: 10, amrap: 12 * 60, rft: 5 };

// The work/rest shown under each alias's name comes from the same object the
// clock reads, not a second copy in the markup -- so the chip cannot end up
// claiming numbers the preset no longer uses.
for (const [key, p] of Object.entries(INTERVALS_PRESETS)) {
  const detail = document.getElementById(`detail-${key}`);
  if (detail) detail.textContent = `${formatDuration(p.work)} / ${formatDuration(p.rest)}`;
}

/* ---------- preferences ---------- */
// Everything the app remembers lives in one localStorage entry. An earlier
// split kept the round count in the URL so a workout was bookmarkable, which
// bought a second place to look when a setting misbehaved.

const STORE_KEY = "emom";
const MAX_COUNT = 99;

// Chrome desktop exposes vibrate() with no hardware behind it; that is harmless.
// The case this actually catches is iOS Safari, which has never shipped it.
const canVibrate = typeof navigator.vibrate === "function";

// The checkboxes are the state; there is nothing to mirror them into.
const wantSound = () => el.cueSound.checked;
const wantBuzz = () => canVibrate && el.cueBuzz.checked;
const MAX_WORK_SECS = 600;         // 10:00
const MAX_WINDOW_SECS = 99 * 60;   // 99:00, the same reach MAX_COUNT has
const validCount = (v) => Number.isInteger(v) && v >= 1 && v <= MAX_COUNT;
const validSeconds = (v, min) => Number.isInteger(v) && v >= min && v <= MAX_WORK_SECS;
const validWindow = (v) => Number.isInteger(v) && v >= 1 && v <= MAX_WINDOW_SECS;

// One field, two kinds of value: AMRAP's is a duration, the other two are
// tallies. A tally is digits and nothing else, so "1:30" is refused for a
// cycle count rather than quietly becoming 90 of them.
const countIsDuration = (strategy) => strategy === "amrap";
const parseTally = (t) => (/^\d+$/.test(String(t).trim()) ? Number(String(t).trim()) : NaN);
const readCount = (strategy) =>
  countIsDuration(strategy) ? parseDuration(el.count.value) : parseTally(el.count.value);
const validForStrategy = (strategy, v) =>
  countIsDuration(strategy) ? validWindow(v) : validCount(v);
const showCount = (strategy, v) =>
  countIsDuration(strategy) ? formatDuration(v) : String(v);

function loadPrefs() {
  // localStorage throws rather than returning null when storage is blocked.
  try {
    return JSON.parse(localStorage.getItem(STORE_KEY)) || {};
  } catch (_) {
    return {};
  }
}

function savePrefs(patch) {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ ...loadPrefs(), ...patch }));
  } catch (_) {}
}

/* ---------- audio ---------- */
// Carried over from kbgen, which learned both of these the hard way:
// the 5 ms attack ramp removes the click an instantaneous gain step produces,
// and the resume() covers a context the browser suspended while backgrounded.

// Audio is a cue, not the clock, so nothing below may throw into its caller.
// initAudio runs in the Start handler and beep runs inside the animation frame:
// an escaping exception would stop the workout starting, or kill it midway.

let audioContext = null;

function initAudio() {
  try {
    if (!audioContext) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      audioContext = new Ctx();
    }
    // Rejects when the context cannot start, which there is nothing to do about.
    if (audioContext.state === "suspended") audioContext.resume().catch(() => {});
  } catch (_) {
    audioContext = null;
  }
}

function beep(frequency, duration, volume = 0.33) {
  initAudio();
  if (!audioContext) return;

  try {
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.frequency.value = frequency;
    const now = audioContext.currentTime;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(volume, now + 0.005);
    // exponentialRampToValueAtTime cannot target 0, hence 0.001.
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.start(now);
    osc.stop(now + duration);
  } catch (_) {
    // Silence is the correct degradation. The countdown carries on.
  }
}

function flash() {
  // Removing the class, forcing a reflow, then re-adding it is what restarts a
  // CSS animation that is already running.
  document.body.classList.remove("flash");
  void document.body.offsetWidth;
  document.body.classList.add("flash");
}

// The flash is never gated: "Silent" means no sound and no buzz, not no cue.
const cues = {
  tick: () => {
    if (wantSound()) beep(660, 0.07, 0.25);
    if (wantBuzz()) navigator.vibrate(50);
  },
  start: () => {
    if (wantSound()) beep(880, 0.12);
    if (wantBuzz()) navigator.vibrate(200);
    flash();
  },
  done: () => {
    if (wantSound()) {
      beep(523, 0.15);
      setTimeout(() => beep(659, 0.15), 220);
      setTimeout(() => beep(784, 0.3), 440);
    }
    if (wantBuzz()) navigator.vibrate([120, 80, 120, 80, 320]);
    flash();
  },
};

/* ---------- screen wake lock ---------- */

let wakeLock = null;

async function holdScreen() {
  if (!("wakeLock" in navigator)) return;
  try {
    const sentinel = await navigator.wakeLock.request("screen");
    // The browser releases the lock itself when the page is hidden, and a
    // released sentinel cannot be reused. Without this the reference outlives
    // the thing it points at and releaseScreen works on a dead sentinel.
    sentinel.addEventListener("release", () => {
      if (wakeLock === sentinel) wakeLock = null;
    });
    wakeLock = sentinel;
  } catch (_) {
    // Denied on low battery, or the tab lost focus mid-request. Not fatal.
  }
}

function releaseScreen() {
  if (!wakeLock) return;
  wakeLock.release().catch(() => {});
  wakeLock = null;
}

// The browser drops the lock whenever the page is hidden, and does not restore
// it on return. Re-request it if a workout is still on screen.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && !el.timer.hidden) holdScreen();
});

/* ---------- clock ---------- */

// One pure function per strategy, dispatched on elapsed ms since prep ended.
// No DOM, no clock, no tap count read from anywhere but their arguments --
// that is what keeps the minute boundaries free of drift and the whole thing
// testable without a browser.
//
// Intervals derives everything, including the round, from elapsed time alone.
// RFT is athlete-paced: the times its taps landed at are state held outside
// derive() and passed in, so its round is never a function of t. AMRAP counts
// nothing and ignores them entirely.

function deriveIntervals(t, config) {
  const { work, rest, intervalCycles } = config;
  const cycle = work + rest;
  const cycleNum = Math.floor(t / cycle) + 1;
  if (cycleNum > intervalCycles) {
    return { phase: "done", round: intervalCycles, remaining: 0 };
  }
  const inCycle = t % cycle;
  // With rest = 0, cycle === work, so inCycle < work always holds and phase
  // never becomes "rest". That equivalence is what makes EMOM Intervals(60, 0).
  if (inCycle < work) {
    return { phase: "work", round: cycleNum, remaining: work - inCycle };
  }
  return { phase: "rest", round: cycleNum, remaining: cycle - inCycle };
}

// No taps: AMRAP's clock ends it either way, so a tap could only ever have kept
// score, and keeping score of rounds mid-effort is something an athlete does in
// their head. RFT is the one strategy where a tap decides anything.
function deriveAmrap(t, config) {
  if (t >= config.amrapWindow) {
    return { phase: "done", remaining: 0 };
  }
  return { phase: "work", remaining: config.amrapWindow - t };
}

// laps holds the elapsed time each completed round ended at, so its length is
// the round count and its last entry is where the round in progress began.
//
// Two clocks come out of that, and they are not the same number: `remaining` is
// the round in progress, restarting from zero at every tap, and `total` runs
// from the start and never resets. RFT is scored on the total, so it stays on
// screen even though the big digits show the round.
// Whole seconds since work began. Every clock on screen shows one of these, so
// a round's length is the difference of two of them rather than the floor of
// their difference. Flooring the difference is what made the two counters tick
// out of step: the total's second turns over on the whole second, a round's
// turned over a tap's worth of milliseconds later, and a tap lands wherever a
// finger lands. Differencing whole seconds also telescopes, so the round times
// on the finish screen add up to the total they are listed under -- flooring
// each round separately threw away up to a second per round, and a 3.8 s pair
// of rounds reported "0:01" twice under a total of "0:03".
//
// The cost is that a round can read up to a second long or short against a
// stopwatch held beside it. That is the sub-second remainder of a tap being
// attributed to one round rather than split, which no display of whole seconds
// can avoid; what it must not do is lose it.
const wholeSecs = (ms) => Math.floor(ms / 1000);

function deriveRft(t, laps, config) {
  const round = laps.length;
  if (round >= config.rftRounds) {
    // The final tap is the finish, so the result is when it landed -- not
    // wherever the frame loop happened to notice, some milliseconds later.
    const finish = laps[round - 1];
    return { phase: "done", round, remaining: 0, total: finish, laps };
  }
  const since = round === 0 ? 0 : laps[round - 1];
  return {
    phase: "work",
    round,
    remaining: (wholeSecs(t) - wholeSecs(since)) * 1000,
    total: t,
    laps,
  };
}

function derive(elapsedMs, laps, config) {
  if (elapsedMs < PREP_MS) {
    return { phase: "prep", round: 0, remaining: PREP_MS - elapsedMs };
  }
  const t = elapsedMs - PREP_MS;
  if (config.strategy === "amrap") return deriveAmrap(t, config);
  if (config.strategy === "rft") return deriveRft(t, laps, config);
  return deriveIntervals(t, config);
}

function plural(n, word) {
  return `${n} ${word}${n === 1 ? "" : "s"}`;
}

// RFT counts up with no bound once its own work phase begins, so nothing
// there counts down to a boundary. Prep is bounded for every strategy, so it
// always gets the 3-2-1, RFT included.
function tickable(state, config) {
  return state.phase === "prep" || config.strategy !== "rft";
}

// RFT's remaining counts up without bound, so its big-digit display is a
// clock face rather than the bare second-count the other two strategies use.
// Floors, which is what a stopwatch counting up wants: 0:00 until a second has
// really passed. A countdown wants the opposite and formats its already-ceiled
// second count through formatDuration instead.
function formatClock(ms) {
  return formatDuration(Math.floor(ms / 1000));
}

const clock = {
  config: null,
  // Elapsed time at each completed round's tap, work-relative. Length is the
  // round count; RFT is the only strategy that fills it.
  laps: [],
  startedAt: 0,
  pausedAt: 0,
  pausedTotal: 0,
  frame: null,
};

// performance.now() rather than Date.now(): monotonic, so a system clock
// change or NTP correction mid-workout cannot skew the round boundaries.
function elapsed() {
  const now = clock.pausedAt || performance.now();
  return now - clock.startedAt - clock.pausedTotal;
}

let lastSecond = null;
let lastRound = null;
let lastPhase = null;

// Fills the huge digit slot on a finish that has no number to put there.
// Intervals and AMRAP both restate what they were set to in the label above
// and have nothing further to report; RFT never uses this, because its
// per-round times are a real result and take the slot instead.
//
// One glyph rather than one per strategy: a different mark for each said
// nothing the label above it had not already said, and finishing is the same
// thing whichever clock got you there.
const DONE_GLYPH = "💪";

// Rebuilt rather than appended to: render() runs every frame and must be safe
// to call repeatedly with the same state, which an append is not.
function showLaps(laps) {
  el.laps.textContent = "";
  laps.forEach((endedAt, i) => {
    const li = document.createElement("li");
    const n = document.createElement("span");
    n.className = "lap-n";
    n.textContent = i + 1;
    const t = document.createElement("span");
    // The gap to the round before, which is the round's own duration, taken
    // between whole seconds so the column adds up to the total above it.
    t.textContent = formatDuration(wholeSecs(endedAt) - wholeSecs(i === 0 ? 0 : laps[i - 1]));
    li.append(n, t);
    el.laps.append(li);
  });
  el.laps.hidden = false;
  // Measured after the rows are in, so it reflects this list rather than the
  // last one. A fake DOM has neither height, and undefined > undefined is
  // false, which is the right answer there: nothing to fade.
  el.laps.className = el.laps.scrollHeight > el.laps.clientHeight ? "clipped" : "";
}

function render(state, secs, config) {
  if (state.phase === "done") {
    const rft = config.strategy === "rft";
    el.phase.textContent = "Done";
    el.seconds.textContent = DONE_GLYPH;
    // The glyph sits between the label and RFT's table because #seconds is
    // already in that slot; nothing new is needed to put it there, and it is
    // the same size on every finish.
    el.seconds.className = "done";
    // What was actually done. Intervals and AMRAP restate what was set, since
    // the clock delivered exactly that; RFT reports its rounds and the total
    // it is scored on, with the per-round times listed underneath.
    el.roundLabel.textContent = config.strategy === "intervals"
      ? plural(config.intervalCycles, "cycle")
      : config.strategy === "amrap"
      // The window as MM:SS, like every other duration. It was minutes here
      // and stayed minutes when the field became seconds, so a 20-second
      // window reported "0.3333333333333333 minutes".
      ? formatDuration(wholeSecs(config.amrapWindow))
      : `${plural(state.round, "round")} \u00b7 ${formatClock(state.total)}`;
    // Explicit either way: at done the branch below never runs, so the list
    // would otherwise keep whatever the last running frame left it at.
    if (rft) showLaps(state.laps);
    else el.laps.hidden = true;
  } else {
    el.phase.textContent = state.phase === "prep" ? "Get ready"
      : state.phase === "rest" ? "Rest" : "Work";
    // MM:SS on every strategy. RFT counts up and floors; the others count down
    // and are already ceiled into `secs`, so each formats the value it wants.
    el.seconds.textContent = config.strategy === "rft"
      ? formatClock(state.remaining)
      : formatDuration(secs);
    el.seconds.className = tickable(state, config) && secs <= 3 ? "warn" : "";
    // U+00A0, matching the markup's &nbsp;. A plain space is collapsible
    // whitespace, so the paragraph would lay out at zero height and the whole
    // centred timer group would jump the moment prep ends and a real label
    // arrives.
    // AMRAP has nothing to count while it runs -- the clock is the whole
    // display -- so it keeps prep's blank line rather than collapsing it.
    el.roundLabel.textContent = state.phase === "prep" || config.strategy === "amrap" ? "\u00a0"
      : config.strategy === "intervals" ? `Cycle ${state.round} / ${config.intervalCycles}`
      // state.round counts rounds *finished*, and the one on screen is the one
      // being worked, so it is the next one up. The total rides alongside it:
      // the digits below show only the current round now, and RFT is scored on
      // the total, which must not leave the screen to make room for a split.
      : `Round ${state.round + 1} \u00b7 ${formatClock(state.total)}`;
    el.laps.hidden = true;
  }

  // Live only while there is a round to record. Prep has none yet and done has
  // no more, and the ring marking the target is drawn off :not(:disabled) --
  // so this is also what keeps that ring off a screen that cannot be tapped.
  const counts = config.strategy === "rft";
  const live = counts && state.phase === "work";
  el.seconds.disabled = !live;
  // One source for both, so the hint cannot promise a tap the target refuses.
  el.tapHint.hidden = !counts;
  el.tapHint.className = live ? "" : "reserved";

  // The ticking number is role="timer" so it is not announced every second.
  // Phase and round changes are worth announcing, and only those.
  if (state.phase !== lastPhase || state.round !== lastRound) {
    el.live.textContent =
      state.phase === "done" ? "Workout complete"
      : state.phase === "prep" ? "Get ready"
      : config.strategy === "intervals" ? `Cycle ${state.round} of ${config.intervalCycles}`
      : `Round ${state.round}`;
  }
}

function cue(state, secs, config) {
  // A transition fires cues.start(): entering work or rest from anything
  // else, or -- for Intervals only -- rolling into a new cycle while the
  // phase stays "work" (rest = 0, so there is no work<->rest edge to catch
  // it). AMRAP and RFT never hit that second branch: their round changes on
  // a tap, not a cycle boundary, and a tap must not re-fire the cue.
  const transitioned =
    (state.phase === "work" || state.phase === "rest") &&
    (state.phase !== lastPhase ||
      (config.strategy === "intervals" && state.round !== lastRound));

  if (state.phase === "done") {
    cues.done();
  } else if (transitioned) {
    cues.start();
  } else if (tickable(state, config) && secs <= 3 && secs >= 1 && secs !== lastSecond) {
    cues.tick();
  }
}

function tick() {
  const state = derive(elapsed(), clock.laps, clock.config);
  const secs = Math.ceil(state.remaining / 1000);

  render(state, secs, clock.config);
  cue(state, secs, clock.config);
  lastSecond = secs;
  lastRound = state.round;
  lastPhase = state.phase;

  if (state.phase === "done") {
    stopLoop();
    releaseScreen();
    el.pause.hidden = true;
    el.seconds.disabled = true;
    el.reset.textContent = "Again";
    return;
  }
  clock.frame = requestAnimationFrame(tick);
}

function stopLoop() {
  if (clock.frame !== null) cancelAnimationFrame(clock.frame);
  clock.frame = null;
}

function start(config) {
  clock.config = config;
  clock.laps = [];
  clock.startedAt = performance.now();
  clock.pausedAt = 0;
  clock.pausedTotal = 0;
  lastSecond = null;
  lastRound = null;
  lastPhase = null;

  el.setup.hidden = true;
  el.timer.hidden = false;
  el.pause.hidden = false;
  el.pause.textContent = "Pause";
  el.reset.textContent = "Reset";

  // RFT alone has a round to record. role="timer" is dropped when tappable so
  // a screen reader announces it as a button rather than a passive live
  // region, which is what "tap to record a round" needs.
  const tappable = config.strategy === "rft";
  // Every workout opens in prep, where there is no round to record yet, so the
  // target starts off and render() turns it on at the first work frame.
  el.seconds.disabled = true;
  if (tappable) {
    el.seconds.removeAttribute("role");
    el.seconds.setAttribute("aria-label", "Record round");
  } else {
    el.seconds.setAttribute("role", "timer");
    el.seconds.removeAttribute("aria-label");
  }

  // Kept through pause too: a paused timer is a rest, and the screen dying
  // mid-rest is the thing this exists to prevent.
  holdScreen();
  tick();
}

function recordTap() {
  // RFT alone: its round count is the finish condition, so a tap is the only
  // thing that can end it. Nothing else here has a round a tap could record.
  if (clock.config.strategy !== "rft") return;
  if (clock.pausedAt) return;
  // The button is disabled outside the work phase, so a browser drops these
  // clicks before they arrive. Stated here anyway: "a round exists to record"
  // is the rule, and leaving it implicit in a DOM attribute puts the rule
  // somewhere the logic cannot be read off.
  const state = derive(elapsed(), clock.laps, clock.config);
  if (state.phase !== "work") return;
  // The tap closes this round and opens the next, so what is recorded is the
  // total at the tap, not the round's duration -- durations fall out of the
  // gaps between entries, and storing them instead would round-trip through
  // an addition that can drift.
  clock.laps.push(elapsed() - PREP_MS);
}

function togglePause() {
  if (clock.pausedAt) {
    clock.pausedTotal += performance.now() - clock.pausedAt;
    clock.pausedAt = 0;
    el.pause.textContent = "Pause";
    document.body.classList.remove("paused");
    tick();
  } else {
    clock.pausedAt = performance.now();
    stopLoop();
    el.pause.textContent = "Resume";
    document.body.classList.add("paused");
  }
}

function toSetup() {
  stopLoop();
  releaseScreen();
  clock.pausedAt = 0;
  document.body.classList.remove("flash", "paused");
  el.timer.hidden = true;
  el.setup.hidden = false;
  el.count.focus();
}

/* ---------- setup form ---------- */

function currentStrategy() {
  return document.querySelector('input[name="strategy"]:checked').value;
}

// The count field means a different thing per strategy, and each strategy
// remembers its own value independently -- switching to AMRAP and back must
// not lose Intervals' cycle count, so each gets its own storage key.
function countKeyFor(strategy) {
  // Not "amrapMinutes": this holds seconds now, and a stored 12 read back as
  // 12 seconds would silently shorten somebody's workout twelve-fold. A new
  // key leaves the old one unread and lets the default take over.
  if (strategy === "amrap") return "amrapWindowSecs";
  if (strategy === "rft") return "rftRounds";
  return "cycles";
}

// Not the strategy's own glyph: the chip above already carries that, and
// repeating it here says nothing the field does not. Each label names what
// its own number is instead -- a repeat count, a duration, a target.
function countLabelFor(strategy) {
  if (strategy === "amrap") return "⏳ Window";
  if (strategy === "rft") return "🎯 Rounds";
  return "🔁 Cycles";
}

function showStrategy(strategy) {
  // Work/rest stay in the layout rather than being removed from it: main
  // centres the form vertically, so a shorter form on AMRAP/RFT would drag
  // everything above it down too, not just the fields themselves. Dimmed and
  // disabled instead, matching how the Buzz checkbox reads when unsupported.
  const isIntervals = strategy === "intervals";
  el.intervalFields.className = isIntervals ? "" : "inactive";
  el.workSecs.disabled = !isIntervals;
  el.restSecs.disabled = !isIntervals;
  el.intervalsPresets.hidden = !isIntervals;
  el.amrapPresets.hidden = strategy !== "amrap";
  el.rftPresets.hidden = strategy !== "rft";
  el.countLabel.textContent = countLabelFor(strategy);
}

function persistSetup() {
  const strategy = currentStrategy();
  savePrefs({
    strategy,
    workSecs: parseDuration(el.workSecs.value),
    restSecs: parseDuration(el.restSecs.value),
    [countKeyFor(strategy)]: readCount(strategy),
  });
}

// Reads the form as it stands and returns a strategy config, or null if the
// count or the work/rest fields hold something unusable.
function buildConfig() {
  const strategy = currentStrategy();
  const count = readCount(strategy);
  if (!validForStrategy(strategy, count)) return null;

  if (strategy === "amrap") return { strategy: "amrap", amrapWindow: count * 1000 };
  if (strategy === "rft") return { strategy: "rft", rftRounds: count };

  const work = parseDuration(el.workSecs.value);
  const rest = parseDuration(el.restSecs.value);
  if (!validSeconds(work, 1) || !validSeconds(rest, 0)) return null;
  return { strategy: "intervals", work: work * 1000, rest: rest * 1000, intervalCycles: count };
}

/* ---------- wiring ---------- */

el.setup.addEventListener("submit", (e) => {
  e.preventDefault();
  const config = buildConfig();
  if (!config) return;
  // Unlock audio on the gesture the autoplay policy wants. The first beep is
  // up to 10 s away, by which point there is no gesture left to hang it on.
  if (wantSound()) initAudio();
  start(config);
});

el.strategies.addEventListener("change", (e) => {
  if (e.target.name !== "strategy") return;
  const strategy = e.target.value;
  showStrategy(strategy);
  const prefs = loadPrefs();
  const stored = prefs[countKeyFor(strategy)];
  el.count.value = showCount(strategy, validForStrategy(strategy, stored) ? stored : DEFAULT_COUNT[strategy]);
  savePrefs({ strategy });
});

// Presets fill in the fields belonging to whichever strategy is already
// active; they never touch the strategy radio, since they are only visible
// when its strategy is already the one selected.
el.intervalsPresets.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-intervals-preset]");
  if (!btn) return;
  const p = INTERVALS_PRESETS[btn.dataset.intervalsPreset];
  el.workSecs.value = formatDuration(p.work);
  el.restSecs.value = formatDuration(p.rest);
  el.count.value = String(p.cycles);
  persistSetup();
});

el.amrapPresets.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-amrap-preset]");
  if (!btn) return;
  // The attribute stays minutes, matching the button's own label.
  el.count.value = formatDuration(Number(btn.dataset.amrapPreset) * 60);
  persistSetup();
});

el.rftPresets.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-rft-preset]");
  if (!btn) return;
  el.count.value = btn.dataset.rftPreset;
  persistSetup();
});

// Saved as typed, matching the checkboxes, so nothing depends on pressing Start.
el.count.addEventListener("input", () => {
  const strategy = currentStrategy();
  if (validForStrategy(strategy, readCount(strategy))) persistSetup();
});
el.workSecs.addEventListener("input", persistSetup);
el.restSecs.addEventListener("input", persistSetup);

// On change rather than input: rewriting "9" to "0:09" while the 0 of "90" is
// still being typed would fight the caret. Leaving the field is when a part-
// typed duration becomes a whole one.
for (const [field, min] of [[el.workSecs, 1], [el.restSecs, 0]]) {
  field.addEventListener("change", () => {
    const secs = parseDuration(field.value);
    // Unreadable input is left exactly as typed. Correcting it to a number
    // nobody asked for is worse than showing that it was not understood.
    if (validSeconds(secs, min)) field.value = formatDuration(secs);
  });
}
el.count.addEventListener("change", () => {
  const strategy = currentStrategy();
  const v = readCount(strategy);
  if (validForStrategy(strategy, v)) el.count.value = showCount(strategy, v);
});

el.cues.addEventListener("change", () => {
  savePrefs({ sound: el.cueSound.checked, buzz: el.cueBuzz.checked });
  if (wantSound()) initAudio();
});

el.pause.addEventListener("click", togglePause);
el.reset.addEventListener("click", toSetup);
el.seconds.addEventListener("click", recordTap);

function init() {
  const prefs = loadPrefs();

  el.cueSound.checked = prefs.sound ?? true;
  el.cueBuzz.checked = canVibrate && (prefs.buzz ?? true);
  el.cueBuzz.disabled = !canVibrate;

  // Left as the markup's fallback when version.js is missing or unstamped.
  // GitHub resolves abbreviated hashes, so the short id is enough to link to.
  if (self.BUILD && self.BUILD !== "dev") {
    el.build.textContent = self.BUILD;
    el.build.href = `https://github.com/nothub/gym-timer/commit/${self.BUILD}`;
  }

  const strategy = STRATEGIES.includes(prefs.strategy) ? prefs.strategy : "intervals";
  document.querySelector(`input[name="strategy"][value="${strategy}"]`).checked = true;
  showStrategy(strategy);

  // Always restored, not just when Intervals is active: they are its own
  // remembered fields, not a per-strategy scratch pad that resets on switch.
  el.workSecs.value = formatDuration(validSeconds(prefs.workSecs, 1) ? prefs.workSecs : 60);
  el.restSecs.value = formatDuration(validSeconds(prefs.restSecs, 0) ? prefs.restSecs : 0);

  const stored = prefs[countKeyFor(strategy)];
  el.count.value = showCount(strategy, validForStrategy(strategy, stored) ? stored : DEFAULT_COUNT[strategy]);
}

init();

// isSecureContext rather than a protocol check: it is true for https and for
// localhost, which is exactly where a service worker is allowed to register.
if ("serviceWorker" in navigator && window.isSecureContext) {
  window.addEventListener("load", () => {
    // updateViaCache: the byte-check that drives updates reads version.js, and
    // without this the HTTP cache can hand back a stale copy of it.
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});
  });
}

// Offline is not what this gates -- the service worker above gives that to
// every engine. This is installing as a standalone app, and only Chromium lets
// a page ask for it: beforeinstallprompt is Chromium-only, and fires only for
// an app meeting its install criteria and not already installed.
//
// Installing is still possible elsewhere, just not from here. iOS Safari puts
// it in the share sheet as "Add to Home Screen" and Firefox on Android in its
// own menu, neither reachable by any API; Firefox on desktop dropped installing
// entirely. So the button is revealed by the event rather than shown and wired
// up hopefully: where the offer never comes, no button could have opened one.
let installPrompt = null;

window.addEventListener("beforeinstallprompt", (e) => {
  // Suppresses Chromium's own install infobar, which otherwise covers the
  // timer, in favour of the footer button.
  e.preventDefault();
  installPrompt = e;
  el.install.hidden = false;
  el.installSep.hidden = false;
});

el.install.addEventListener("click", () => {
  if (!installPrompt) return;
  // Single-use whichever way it is answered: a prompted event cannot be
  // prompted again, so the button goes rather than linger offering a dead
  // second go. Chromium fires a fresh event if it wants to offer again.
  const offer = installPrompt;
  installPrompt = null;
  el.install.hidden = true;
  el.installSep.hidden = true;
  offer.prompt();
});

window.addEventListener("appinstalled", () => {
  installPrompt = null;
  el.install.hidden = true;
  el.installSep.hidden = true;
});
</script>

</body>
</html>
