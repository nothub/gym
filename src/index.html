<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Timer</title>
<meta name="theme-color" content="#0f0f0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-4: 1rem;
  --space-6: 1.5rem;

  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.5rem;
  --text-huge: clamp(5rem, 42vmin, 20rem);

  /* Palette carried over from kbgen. --dim is as dark as it can go: #7c on
     #0f0f0f is 4.6:1, and the 14px labels that use it need 4.5:1. kbgen's
     own #666 is 3.3:1, which is why this is not simply its value. */
  --bg: #0f0f0f;
  --srf: #1a1a1a;
  --brd: #2c2c2c;
  --txt: #efefef;
  --dim: #7c7c7c;
  --acc: #f97316;
  --ok: #4ade80;

  --radius: 0.5rem;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--txt);
  font-family: system-ui, sans-serif;
  -webkit-text-size-adjust: 100%;
}

/* Full width rather than shrink-to-fit, so percentage widths inside it have a
   definite containing block to resolve against. */
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: var(--space-4);
}

h1 {
  margin: 0 0 var(--space-6);
  font-size: var(--text-lg);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--dim);
  text-align: center;
}

/* Setup */

#setup {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  width: 100%;
  max-width: 20rem;
}

label {
  font-size: var(--text-sm);
  color: var(--dim);
}

input[type="number"] {
  width: 100%;
  margin-top: var(--space-1);
  padding: var(--space-4);
  font-size: var(--text-lg);
  font-family: inherit;
  text-align: center;
  color: var(--txt);
  background: var(--srf);
  border: 1px solid var(--brd);
  border-radius: var(--radius);
}

button {
  padding: var(--space-4);
  font-size: var(--text-base);
  font-family: inherit;
  color: var(--txt);
  background: var(--srf);
  border: 1px solid var(--brd);
  border-radius: var(--radius);
  cursor: pointer;
}

button[type="submit"] {
  color: var(--bg);
  background: var(--acc);
  border-color: var(--acc);
  font-weight: 600;
}

:is(button, input):focus-visible {
  outline: 2px solid var(--acc);
  outline-offset: 2px;
}

/* Cue settings */

fieldset {
  display: flex;
  justify-content: center;
  gap: var(--space-6);
  margin: 0;
  padding: 0;
  border: 0;
}

fieldset label {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-base);
  color: var(--txt);
  cursor: pointer;
}

fieldset label:has(input:disabled) {
  color: var(--dim);
  cursor: not-allowed;
}

input[type="checkbox"] {
  width: 1.1rem;
  height: 1.1rem;
  accent-color: var(--acc);
  cursor: inherit;
}

/* Presets. The radio itself is visually hidden but stays in the tab order and
   inside its label, so a click anywhere on the chip and a screen reader both
   reach the same control -- no id/for pairing to keep in sync. */

#presets {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-4); /* wider than a group's own gap: the space is the divider */
  margin: 0;
  padding: 0;
  border: 0;
}

.preset-group {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

#presets label {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: var(--space-2) var(--space-4);
  font-size: var(--text-sm);
  line-height: 1.3;
  color: var(--dim);
  background: var(--srf);
  border: 1px solid var(--brd);
  border-radius: var(--radius);
  cursor: pointer;
}

/* Work/rest in seconds, under the name, on the three fixed-number aliases
   only -- AMRAP, RFT and Custom have no canonical pair to show. */
.preset-detail {
  font-size: 0.7em;
  opacity: 0.75;
  font-variant-numeric: tabular-nums;
}

#presets input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}

#presets label:has(input:checked) {
  color: var(--bg);
  background: var(--acc);
  border-color: var(--acc);
}

#presets label:has(input:focus-visible) {
  outline: 2px solid var(--acc);
  outline-offset: 2px;
}

#custom-fields {
  display: flex;
  gap: var(--space-4);
}

#custom-fields > div { flex: 1; }

/* Timer */

#timer {
  flex: 1;
  align-self: stretch;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  text-align: center;
}

#phase {
  margin: 0;
  font-size: var(--text-sm);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--dim);
}

/* #seconds is a <button>: in AMRAP and RFT it is the tap target, chosen
   because it is the largest thing on screen and the athlete is not aiming
   carefully. Reset to plain text and re-enable pointer affordance only when
   JS marks it interactive. */
#seconds {
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  font-family: inherit;
  font-size: var(--text-huge);
  font-weight: 200;
  line-height: 0.9;
  font-variant-numeric: tabular-nums;
  color: inherit;
  cursor: default;
}

/* A button with every default reset looks identical to plain text, and a
   touchscreen has no hover state to hint at it either -- so tappability needs
   a persistent mark, not just a cursor. box-shadow rather than border: it
   does not participate in layout, so the centred-digits geometry is unaffected. */
#seconds:not(:disabled) {
  cursor: pointer;
  padding: 0 var(--space-6);
  border-radius: var(--radius);
  /* --dim, not --brd: --brd is tuned for a hairline on a small input, and
     disappears entirely at this size against --bg. */
  box-shadow: inset 0 0 0 2px var(--dim);
}

#seconds:not(:disabled):active { transform: scale(0.97); }

#seconds:focus-visible {
  outline: 2px solid var(--acc);
  outline-offset: 4px;
}

#seconds.warn { color: var(--acc); }

/* The 0.9 line height above is tuned to digits. An emoji glyph is taller than
   that box, so without a correction here the arm overlaps the line below.
   The colour only shows if the platform substitutes a monochrome glyph. */
#seconds.done {
  color: var(--ok);
  line-height: 1.25;
}

#round-label {
  margin: 0;
  font-size: var(--text-lg);
  font-variant-numeric: tabular-nums;
  color: var(--dim);
}

#controls {
  display: flex;
  gap: var(--space-4);
  margin-top: var(--space-6);
}

#controls button { min-width: 7rem; }

/* Cues.
   The flash has to read from across a room, so it takes the whole viewport.
   Text flips to --bg on --acc (6.8:1) for the duration rather than staying
   light, which would be 2.4:1 and unreadable. */

@keyframes flash-body { 0%, 60% { background: var(--acc); color: var(--bg); } }
@keyframes flash-label { 0%, 60% { color: var(--bg); } }

body.flash { animation: flash-body 400ms ease-out; }
body.flash :is(#phase, #round-label, #seconds, footer a) { animation: flash-label 400ms ease-out; }

@media (prefers-reduced-motion: no-preference) {
  /* Starts exactly when the count hits 3, so the 1s loop stays in phase with it. */
  #seconds.warn { animation: pulse 1s ease-out infinite; }

  /* Frozen rather than cleared: a stopped clock that is still pulsing reads
     as running. play-state holds it where it was instead of snapping. */
  body.paused #seconds { animation-play-state: paused; }
  @keyframes pulse { from { transform: scale(1.06); } to { transform: scale(1); } }
}

footer {
  padding: var(--space-4);
  text-align: center;
  font-size: var(--text-sm);
}

footer a {
  color: var(--dim);
  text-decoration: none;
}

footer a:hover { color: var(--txt); }

footer a:focus-visible {
  outline: 2px solid var(--acc);
  outline-offset: 2px;
}

[hidden] { display: none !important; }

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

noscript p {
  max-width: 28rem;
  text-align: center;
  color: var(--dim);
}
</style>
</head>
<body>

<main>
  <form id="setup">
    <h1>Timer</h1>

    <fieldset id="presets">
      <legend class="sr-only">Strategy</legend>
      <!-- EMOM, E2MOM and Tabata are named aliases for Intervals(work, rest):
           fixed numbers under one name. Grouped apart from AMRAP, RFT and
           Custom, which are not -- the first two are their own strategies,
           and Custom has no canonical numbers to be an alias of. -->
      <div class="preset-group">
        <label>
          <input type="radio" name="preset" value="emom" checked> EMOM
          <span class="preset-detail" id="detail-emom"></span>
        </label>
        <label>
          <input type="radio" name="preset" value="e2mom"> E2MOM
          <span class="preset-detail" id="detail-e2mom"></span>
        </label>
        <label>
          <input type="radio" name="preset" value="tabata"> Tabata
          <span class="preset-detail" id="detail-tabata"></span>
        </label>
      </div>
      <div class="preset-group">
        <label><input type="radio" name="preset" value="amrap"> AMRAP</label>
        <label><input type="radio" name="preset" value="rft"> RFT</label>
        <label><input type="radio" name="preset" value="custom"> Custom</label>
      </div>
    </fieldset>

    <div>
      <label for="count" id="count-label">Cycles</label>
      <input id="count" name="count" type="number" inputmode="numeric"
             min="1" max="99" step="1" value="10" required>
    </div>

    <div id="custom-fields" hidden>
      <div>
        <label for="work-secs">Work (s)</label>
        <input id="work-secs" type="number" inputmode="numeric" min="1" max="600" step="1" value="40">
      </div>
      <div>
        <label for="rest-secs">Rest (s)</label>
        <input id="rest-secs" type="number" inputmode="numeric" min="0" max="600" step="1" value="20">
      </div>
    </div>

    <fieldset id="cues">
      <legend class="sr-only">Cues</legend>
      <label><input id="cue-sound" type="checkbox" checked> Sound</label>
      <label><input id="cue-buzz" type="checkbox" checked> Buzz</label>
    </fieldset>

    <button type="submit">Start</button>
  </form>

  <section id="timer" hidden>
    <p id="round-label">&nbsp;</p>
    <button type="button" id="seconds" role="timer" disabled>10</button>
    <p id="phase">Get ready</p>
    <div id="controls">
      <button type="button" id="pause">Pause</button>
      <button type="button" id="reset">Reset</button>
    </div>
  </section>
</main>

<footer>
  <!-- _blank so a standalone install hands these to the browser rather than
       navigating the timer away mid-workout.
       The build link is filled in from version.js at runtime. What is written
       here is the fallback: "dev" pointing at the commit list is the honest
       answer for a copy that was never built. -->
  <a href="https://github.com/nothub/gym-timer" target="_blank" rel="noopener noreferrer">nothub/gym-timer</a>
  <span aria-hidden="true">·</span>
  <a id="build" href="https://github.com/nothub/gym-timer/commits/trunk" target="_blank" rel="noopener noreferrer">dev</a>
</footer>

<p id="live" class="sr-only" aria-live="polite"></p>

<noscript>
  <p>This timer needs JavaScript. There is no way to count seconds without it.</p>
</noscript>

<!-- Sets self.BUILD. The service worker imports this same file, so the footer
     and the worker's cache name cannot disagree about which build is running. -->
<script src="version.js"></script>

<script>
"use strict";

const PREP_MS = 10000;

const el = {
  setup: document.getElementById("setup"),
  presets: document.getElementById("presets"),
  count: document.getElementById("count"),
  countLabel: document.getElementById("count-label"),
  customFields: document.getElementById("custom-fields"),
  workSecs: document.getElementById("work-secs"),
  restSecs: document.getElementById("rest-secs"),
  timer: document.getElementById("timer"),
  phase: document.getElementById("phase"),
  seconds: document.getElementById("seconds"),
  roundLabel: document.getElementById("round-label"),
  pause: document.getElementById("pause"),
  reset: document.getElementById("reset"),
  live: document.getElementById("live"),
  cues: document.getElementById("cues"),
  cueSound: document.getElementById("cue-sound"),
  cueBuzz: document.getElementById("cue-buzz"),
  build: document.getElementById("build"),
};

/* ---------- strategies ---------- */
// A named Intervals preset fixes work, rest and a canonical cycle count.
// "Custom" is Intervals with work/rest read from the form instead. AMRAP and
// RFT have no work/rest -- the single count field means something different
// for each, which is why it carries a preset-specific label (see countLabelFor).
const INTERVAL_PRESETS = {
  emom: { work: 60, rest: 0, cycles: 10 },
  e2mom: { work: 120, rest: 0, cycles: 6 },
  // Timing convention only, not the 1996 protocol: see .ai/work/strategies/spec.md.
  tabata: { work: 20, rest: 10, cycles: 8 },
};
const DEFAULT_COUNT = { custom: 10, amrap: 12, rft: 5 };
const PRESET_KEYS = ["emom", "e2mom", "tabata", "custom", "amrap", "rft"];

// The work/rest shown under each alias's name comes from the same object the
// clock reads, not a second copy in the markup -- so the chip cannot end up
// claiming numbers the preset no longer uses.
for (const [key, p] of Object.entries(INTERVAL_PRESETS)) {
  const detail = document.getElementById(`detail-${key}`);
  if (detail) detail.textContent = `${p.work}/${p.rest}`;
}

/* ---------- preferences ---------- */
// Everything the app remembers lives in one localStorage entry. An earlier
// split kept the round count in the URL so a workout was bookmarkable, which
// bought a second place to look when a setting misbehaved.

const STORE_KEY = "emom";
const MAX_COUNT = 99;

// Chrome desktop exposes vibrate() with no hardware behind it; that is harmless.
// The case this actually catches is iOS Safari, which has never shipped it.
const canVibrate = typeof navigator.vibrate === "function";

// The checkboxes are the state; there is nothing to mirror them into.
const wantSound = () => el.cueSound.checked;
const wantBuzz = () => canVibrate && el.cueBuzz.checked;
const validCount = (v) => Number.isInteger(v) && v >= 1 && v <= MAX_COUNT;
const validSeconds = (v, min) => Number.isInteger(v) && v >= min && v <= 600;

function loadPrefs() {
  // localStorage throws rather than returning null when storage is blocked.
  try {
    return JSON.parse(localStorage.getItem(STORE_KEY)) || {};
  } catch (_) {
    return {};
  }
}

function savePrefs(patch) {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ ...loadPrefs(), ...patch }));
  } catch (_) {}
}

/* ---------- audio ---------- */
// Carried over from kbgen, which learned both of these the hard way:
// the 5 ms attack ramp removes the click an instantaneous gain step produces,
// and the resume() covers a context the browser suspended while backgrounded.

// Audio is a cue, not the clock, so nothing below may throw into its caller.
// initAudio runs in the Start handler and beep runs inside the animation frame:
// an escaping exception would stop the workout starting, or kill it midway.

let audioContext = null;

function initAudio() {
  try {
    if (!audioContext) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      audioContext = new Ctx();
    }
    // Rejects when the context cannot start, which there is nothing to do about.
    if (audioContext.state === "suspended") audioContext.resume().catch(() => {});
  } catch (_) {
    audioContext = null;
  }
}

function beep(frequency, duration, volume = 0.33) {
  initAudio();
  if (!audioContext) return;

  try {
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.frequency.value = frequency;
    const now = audioContext.currentTime;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(volume, now + 0.005);
    // exponentialRampToValueAtTime cannot target 0, hence 0.001.
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.start(now);
    osc.stop(now + duration);
  } catch (_) {
    // Silence is the correct degradation. The countdown carries on.
  }
}

function flash() {
  // Removing the class, forcing a reflow, then re-adding it is what restarts a
  // CSS animation that is already running.
  document.body.classList.remove("flash");
  void document.body.offsetWidth;
  document.body.classList.add("flash");
}

// The flash is never gated: "Silent" means no sound and no buzz, not no cue.
const cues = {
  tick: () => {
    if (wantSound()) beep(660, 0.07, 0.25);
    if (wantBuzz()) navigator.vibrate(50);
  },
  start: () => {
    if (wantSound()) beep(880, 0.12);
    if (wantBuzz()) navigator.vibrate(200);
    flash();
  },
  done: () => {
    if (wantSound()) {
      beep(523, 0.15);
      setTimeout(() => beep(659, 0.15), 220);
      setTimeout(() => beep(784, 0.3), 440);
    }
    if (wantBuzz()) navigator.vibrate([120, 80, 120, 80, 320]);
    flash();
  },
};

/* ---------- screen wake lock ---------- */

let wakeLock = null;

async function holdScreen() {
  if (!("wakeLock" in navigator)) return;
  try {
    const sentinel = await navigator.wakeLock.request("screen");
    // The browser releases the lock itself when the page is hidden, and a
    // released sentinel cannot be reused. Without this the reference outlives
    // the thing it points at and releaseScreen works on a dead sentinel.
    sentinel.addEventListener("release", () => {
      if (wakeLock === sentinel) wakeLock = null;
    });
    wakeLock = sentinel;
  } catch (_) {
    // Denied on low battery, or the tab lost focus mid-request. Not fatal.
  }
}

function releaseScreen() {
  if (!wakeLock) return;
  wakeLock.release().catch(() => {});
  wakeLock = null;
}

// The browser drops the lock whenever the page is hidden, and does not restore
// it on return. Re-request it if a workout is still on screen.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && !el.timer.hidden) holdScreen();
});

/* ---------- clock ---------- */

// One pure function per strategy, dispatched on elapsed ms since prep ended.
// No DOM, no clock, no tap count read from anywhere but their arguments --
// that is what keeps the minute boundaries free of drift and the whole thing
// testable without a browser.
//
// Intervals derives everything, including the round, from elapsed time alone.
// AMRAP and RFT are athlete-paced: taps are state held outside derive() and
// passed in, so "round" for those two is never a function of t.

function deriveIntervals(t, config) {
  const { work, rest, intervalCycles } = config;
  const cycle = work + rest;
  const cycleNum = Math.floor(t / cycle) + 1;
  if (cycleNum > intervalCycles) {
    return { phase: "done", round: intervalCycles, remaining: 0 };
  }
  const inCycle = t % cycle;
  // With rest = 0, cycle === work, so inCycle < work always holds and phase
  // never becomes "rest". That equivalence is what makes EMOM Intervals(60, 0).
  if (inCycle < work) {
    return { phase: "work", round: cycleNum, remaining: work - inCycle };
  }
  return { phase: "rest", round: cycleNum, remaining: cycle - inCycle };
}

function deriveAmrap(t, taps, config) {
  if (t >= config.amrapWindow) {
    return { phase: "done", round: taps, remaining: 0 };
  }
  return { phase: "work", round: taps, remaining: config.amrapWindow - t };
}

function deriveRft(t, taps, config) {
  // Done is a tap-count threshold, not a time one: t only ever counts up.
  if (taps >= config.rftRounds) {
    return { phase: "done", round: taps, remaining: t };
  }
  return { phase: "work", round: taps, remaining: t };
}

function derive(elapsedMs, taps, config) {
  if (elapsedMs < PREP_MS) {
    return { phase: "prep", round: 0, remaining: PREP_MS - elapsedMs };
  }
  const t = elapsedMs - PREP_MS;
  if (config.strategy === "amrap") return deriveAmrap(t, taps, config);
  if (config.strategy === "rft") return deriveRft(t, taps, config);
  return deriveIntervals(t, config);
}

function plural(n, word) {
  return `${n} ${word}${n === 1 ? "" : "s"}`;
}

// RFT counts up with no bound once its own work phase begins, so nothing
// there counts down to a boundary. Prep is bounded for every strategy, so it
// always gets the 3-2-1, RFT included.
function tickable(state, config) {
  return state.phase === "prep" || config.strategy !== "rft";
}

// RFT's remaining counts up without bound, so its big-digit display is a
// clock face rather than the bare second-count the other two strategies use.
function formatClock(ms) {
  const totalSecs = Math.floor(ms / 1000);
  const mins = Math.floor(totalSecs / 60);
  const secs = totalSecs % 60;
  return `${mins}:${String(secs).padStart(2, "0")}`;
}

const clock = {
  config: null,
  taps: 0,
  startedAt: 0,
  pausedAt: 0,
  pausedTotal: 0,
  frame: null,
};

// performance.now() rather than Date.now(): monotonic, so a system clock
// change or NTP correction mid-workout cannot skew the round boundaries.
function elapsed() {
  const now = clock.pausedAt || performance.now();
  return now - clock.startedAt - clock.pausedTotal;
}

let lastSecond = null;
let lastRound = null;
let lastPhase = null;

function render(state, secs, config) {
  if (state.phase === "done") {
    el.phase.textContent = "Done";
    el.seconds.textContent = config.strategy === "rft" ? formatClock(state.remaining) : "💪";
    el.seconds.className = "done";
    el.roundLabel.textContent = config.strategy === "intervals"
      ? plural(config.intervalCycles, "cycle")
      : plural(state.round, "round");
  } else {
    el.phase.textContent = state.phase === "prep" ? "Get ready"
      : state.phase === "rest" ? "Rest" : "Work";
    el.seconds.textContent = config.strategy === "rft" ? formatClock(state.remaining) : String(secs);
    el.seconds.className = tickable(state, config) && secs <= 3 ? "warn" : "";
    el.roundLabel.textContent = state.phase === "prep" ? " "
      : config.strategy === "intervals" ? `Cycle ${state.round} / ${config.intervalCycles}`
      : `Round ${state.round}`;
  }

  // The ticking number is role="timer" so it is not announced every second.
  // Phase and round changes are worth announcing, and only those.
  if (state.phase !== lastPhase || state.round !== lastRound) {
    el.live.textContent =
      state.phase === "done" ? "Workout complete"
      : state.phase === "prep" ? "Get ready"
      : config.strategy === "intervals" ? `Cycle ${state.round} of ${config.intervalCycles}`
      : `Round ${state.round}`;
  }
}

function cue(state, secs, config) {
  // A transition fires cues.start(): entering work or rest from anything
  // else, or -- for Intervals only -- rolling into a new cycle while the
  // phase stays "work" (rest = 0, so there is no work<->rest edge to catch
  // it). AMRAP and RFT never hit that second branch: their round changes on
  // a tap, not a cycle boundary, and a tap must not re-fire the cue.
  const transitioned =
    (state.phase === "work" || state.phase === "rest") &&
    (state.phase !== lastPhase ||
      (config.strategy === "intervals" && state.round !== lastRound));

  if (state.phase === "done") {
    cues.done();
  } else if (transitioned) {
    cues.start();
  } else if (tickable(state, config) && secs <= 3 && secs >= 1 && secs !== lastSecond) {
    cues.tick();
  }
}

function tick() {
  const state = derive(elapsed(), clock.taps, clock.config);
  const secs = Math.ceil(state.remaining / 1000);

  render(state, secs, clock.config);
  cue(state, secs, clock.config);
  lastSecond = secs;
  lastRound = state.round;
  lastPhase = state.phase;

  if (state.phase === "done") {
    stopLoop();
    releaseScreen();
    el.pause.hidden = true;
    el.seconds.disabled = true;
    el.reset.textContent = "Again";
    return;
  }
  clock.frame = requestAnimationFrame(tick);
}

function stopLoop() {
  if (clock.frame !== null) cancelAnimationFrame(clock.frame);
  clock.frame = null;
}

function start(config) {
  clock.config = config;
  clock.taps = 0;
  clock.startedAt = performance.now();
  clock.pausedAt = 0;
  clock.pausedTotal = 0;
  lastSecond = null;
  lastRound = null;
  lastPhase = null;

  el.setup.hidden = true;
  el.timer.hidden = false;
  el.pause.hidden = false;
  el.pause.textContent = "Pause";
  el.reset.textContent = "Reset";

  // Only AMRAP and RFT have a round to record. role="timer" is dropped when
  // tappable so a screen reader announces it as a button rather than a
  // passive live region, which is what "tap to record a round" needs.
  const tappable = config.strategy === "amrap" || config.strategy === "rft";
  el.seconds.disabled = !tappable;
  if (tappable) {
    el.seconds.removeAttribute("role");
    el.seconds.setAttribute("aria-label", "Record round");
  } else {
    el.seconds.setAttribute("role", "timer");
    el.seconds.removeAttribute("aria-label");
  }

  // Kept through pause too: a paused timer is a rest, and the screen dying
  // mid-rest is the thing this exists to prevent.
  holdScreen();
  tick();
}

function recordTap() {
  if (clock.config.strategy !== "amrap" && clock.config.strategy !== "rft") return;
  if (clock.pausedAt) return;
  clock.taps += 1;
}

function togglePause() {
  if (clock.pausedAt) {
    clock.pausedTotal += performance.now() - clock.pausedAt;
    clock.pausedAt = 0;
    el.pause.textContent = "Pause";
    document.body.classList.remove("paused");
    tick();
  } else {
    clock.pausedAt = performance.now();
    stopLoop();
    el.pause.textContent = "Resume";
    document.body.classList.add("paused");
  }
}

function toSetup() {
  stopLoop();
  releaseScreen();
  clock.pausedAt = 0;
  document.body.classList.remove("flash", "paused");
  el.timer.hidden = true;
  el.setup.hidden = false;
  el.count.focus();
}

/* ---------- setup form ---------- */

function currentPreset() {
  return document.querySelector('input[name="preset"]:checked').value;
}

function countLabelFor(preset) {
  if (preset === "amrap") return "Minutes";
  if (preset === "rft") return "Rounds";
  return "Cycles";
}

function persistSetup() {
  savePrefs({
    preset: currentPreset(),
    count: Math.floor(el.count.valueAsNumber),
    workSecs: Math.floor(el.workSecs.valueAsNumber),
    restSecs: Math.floor(el.restSecs.valueAsNumber),
  });
}

// Reads the form as it stands and returns a strategy config, or null if the
// count or the custom work/rest fields hold something unusable.
function buildConfig() {
  const preset = currentPreset();
  const count = Math.floor(el.count.valueAsNumber);
  if (!validCount(count)) return null;

  if (preset === "amrap") return { strategy: "amrap", amrapWindow: count * 60000 };
  if (preset === "rft") return { strategy: "rft", rftRounds: count };

  const { work, rest } = preset === "custom"
    ? { work: Math.floor(el.workSecs.valueAsNumber), rest: Math.floor(el.restSecs.valueAsNumber) }
    : INTERVAL_PRESETS[preset];
  if (!validSeconds(work, 1) || !validSeconds(rest, 0)) return null;
  return { strategy: "intervals", work: work * 1000, rest: rest * 1000, intervalCycles: count };
}

/* ---------- wiring ---------- */

el.setup.addEventListener("submit", (e) => {
  e.preventDefault();
  const config = buildConfig();
  if (!config) return;
  // Unlock audio on the gesture the autoplay policy wants. The first beep is
  // up to 10 s away, by which point there is no gesture left to hang it on.
  if (wantSound()) initAudio();
  start(config);
});

// A named preset applies its canonical numbers; Custom leaves work/rest as
// they are, since it has none of its own to apply.
el.presets.addEventListener("change", (e) => {
  if (e.target.name !== "preset") return;
  const preset = e.target.value;
  el.customFields.hidden = preset !== "custom";
  el.countLabel.textContent = countLabelFor(preset);
  if (preset in INTERVAL_PRESETS) {
    const p = INTERVAL_PRESETS[preset];
    el.workSecs.value = String(p.work);
    el.restSecs.value = String(p.rest);
    el.count.value = String(p.cycles);
  } else {
    el.count.value = String(DEFAULT_COUNT[preset] ?? 10);
  }
  persistSetup();
});

// Saved as typed, matching the checkboxes, so nothing depends on pressing Start.
el.count.addEventListener("input", () => {
  if (validCount(Math.floor(el.count.valueAsNumber))) persistSetup();
});
el.workSecs.addEventListener("input", persistSetup);
el.restSecs.addEventListener("input", persistSetup);

el.cues.addEventListener("change", () => {
  savePrefs({ sound: el.cueSound.checked, buzz: el.cueBuzz.checked });
  if (wantSound()) initAudio();
});

el.pause.addEventListener("click", togglePause);
el.reset.addEventListener("click", toSetup);
el.seconds.addEventListener("click", recordTap);

function init() {
  const prefs = loadPrefs();

  el.cueSound.checked = prefs.sound ?? true;
  el.cueBuzz.checked = canVibrate && (prefs.buzz ?? true);
  el.cueBuzz.disabled = !canVibrate;

  // Left as the markup's fallback when version.js is missing or unstamped.
  // GitHub resolves abbreviated hashes, so the short id is enough to link to.
  if (self.BUILD && self.BUILD !== "dev") {
    el.build.textContent = self.BUILD;
    el.build.href = `https://github.com/nothub/gym-timer/commit/${self.BUILD}`;
  }

  const preset = PRESET_KEYS.includes(prefs.preset) ? prefs.preset : "emom";
  document.querySelector(`input[name="preset"][value="${preset}"]`).checked = true;
  el.customFields.hidden = preset !== "custom";
  el.countLabel.textContent = countLabelFor(preset);

  if (preset in INTERVAL_PRESETS) {
    const p = INTERVAL_PRESETS[preset];
    el.workSecs.value = String(p.work);
    el.restSecs.value = String(p.rest);
  } else if (preset === "custom") {
    el.workSecs.value = String(validSeconds(prefs.workSecs, 1) ? prefs.workSecs : 40);
    el.restSecs.value = String(validSeconds(prefs.restSecs, 0) ? prefs.restSecs : 20);
  }

  const fallback = preset in INTERVAL_PRESETS ? INTERVAL_PRESETS[preset].cycles : (DEFAULT_COUNT[preset] ?? 10);
  el.count.value = String(validCount(prefs.count) ? prefs.count : fallback);
}

init();

// isSecureContext rather than a protocol check: it is true for https and for
// localhost, which is exactly where a service worker is allowed to register.
if ("serviceWorker" in navigator && window.isSecureContext) {
  window.addEventListener("load", () => {
    // updateViaCache: the byte-check that drives updates reads version.js, and
    // without this the HTTP cache can hand back a stale copy of it.
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});
  });
}
</script>

</body>
</html>
